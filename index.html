<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Feed · 记录此刻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 顶栏 + 导航 -->
    <header class="app-header">
      <div class="brand">
        <h1 class="logo">Mini Feed</h1>
        <p class="tagline">记录此刻，分享此刻</p>
      </div>
      <nav class="tabbar" role="tablist">
        <button class="tab is-active" type="button" role="tab" data-view="home">首页</button>
        <button class="tab" type="button" role="tab" data-view="profile">个人中心</button>
      </nav>
    </header>

    <!-- 存储不可用提示 -->
    <div id="storage-warning" class="storage-warning hidden" role="alert">
      ⚠️ 当前浏览器禁用了本地存储，数据仅本次会话有效（关闭页面后会丢失）。建议通过本地服务器访问。
    </div>

    <main>
      <!-- ===== 首页 ===== -->
      <section id="view-home" class="view">
        <!-- 天气 / 时间 卡片 -->
        <section id="weather-card" class="today-card card">
          <div class="weather-left">
            <span id="weather-icon" class="weather-icon" aria-hidden="true">🌤️</span>
            <div class="weather-info">
              <p id="weather-temp" class="weather-temp">--°</p>
              <p id="weather-desc" class="weather-desc">天气加载中…</p>
            </div>
          </div>
          <div class="weather-right">
            <p id="weather-location" class="weather-location">📍 定位中…</p>
            <p id="weather-time" class="weather-time">--</p>
          </div>
          <button id="weather-refresh" class="weather-refresh" type="button" title="刷新天气" aria-label="刷新天气">⟳</button>
        </section>

        <section class="composer card">
          <textarea
            id="composer-input"
            maxlength="280"
            rows="3"
            placeholder="此刻在想什么？（Ctrl + Enter 快速发布）"
          ></textarea>
          <div class="composer-bar">
            <span id="char-counter" class="char-counter">0 / 280</span>
            <button id="publish-btn" class="btn-primary" type="button" disabled>发布</button>
          </div>
        </section>

        <div class="section-title">
          <span>最新动态</span>
          <span id="post-count" class="count-badge">0 条</span>
        </div>

        <div id="timeline" class="timeline" aria-live="polite"></div>

        <div id="empty-state" class="empty-state">
          <p>还没有动态</p>
          <p class="empty-hint">写下第一条，开始你的记录吧 ✍️</p>
        </div>
      </section>

      <!-- ===== 个人中心 ===== -->
      <section id="view-profile" class="view hidden">
        <div class="profile-card card">
          <div class="profile-main">
            <div id="profile-avatar" class="avatar avatar-lg">🙂</div>
            <div class="profile-meta">
              <h2 id="profile-name" class="profile-name">我</h2>
              <p id="profile-bio" class="profile-bio">这个人很懒，什么都没写。</p>
              <p id="profile-since" class="profile-since"></p>
            </div>
            <button id="edit-profile-btn" class="btn-ghost" type="button">编辑资料</button>
          </div>

          <form id="profile-form" class="profile-form hidden">
            <label class="field">
              <span class="field-label">昵称</span>
              <input id="profile-name-input" type="text" maxlength="20" placeholder="给自己起个名字">
            </label>
            <label class="field">
              <span class="field-label">简介</span>
              <input id="profile-bio-input" type="text" maxlength="60" placeholder="一句话介绍自己">
            </label>
            <div class="field">
              <span class="field-label">头像</span>
              <div id="avatar-picker" class="avatar-picker"></div>
            </div>
            <div class="form-actions">
              <button type="button" id="cancel-profile" class="btn-ghost">取消</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>

          <div class="stats">
            <div class="stat">
              <span id="stat-posts" class="stat-value">0</span>
              <span class="stat-label">动态</span>
            </div>
            <div class="stat">
              <span id="stat-chars" class="stat-value">0</span>
              <span class="stat-label">累计字数</span>
            </div>
            <div class="stat">
              <span id="stat-days" class="stat-value">1</span>
              <span class="stat-label">使用天数</span>
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>我的动态</span>
          <span id="my-post-count" class="count-badge">0 条</span>
        </div>

        <div id="my-timeline" class="timeline"></div>

        <div id="my-empty" class="empty-state hidden">
          <p>你还没有发布过动态</p>
          <p class="empty-hint">回到首页写一条吧 ✍️</p>
        </div>

        <div class="data-card card">
          <div class="data-head">
            <span class="data-title">数据管理</span>
            <span id="storage-text" class="storage-text">本地存储占用：--</span>
          </div>
          <div class="storage-bar" role="progressbar" aria-label="本地存储占用">
            <span id="storage-fill" class="storage-fill"></span>
          </div>

          <div class="data-actions">
            <button id="export-btn" class="btn-ghost" type="button">导出备份</button>
            <button id="import-btn" class="btn-ghost" type="button">导入备份</button>
            <button id="clear-all-btn" class="btn-danger" type="button">清空数据</button>
          </div>
          <p class="data-hint">导出为 JSON 文件；导入采用合并方式，不会覆盖已有动态。</p>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </section>

      <!-- ===== 动态详情 ===== -->
      <section id="view-detail" class="view hidden">
        <button id="back-btn" class="btn-ghost back-btn" type="button">← 返回</button>
        <article id="detail-post" class="card detail-post"></article>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <footer class="app-footer">
      <p>数据仅保存在本机浏览器（Local Storage）</p>
    </footer>
  </div>

  <script src="weather.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
